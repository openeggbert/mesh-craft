# MeshCraft CI — STAB-0025 skeleton.
#
# DEACTIVATED: this file lives under `.github_/` (note the trailing underscore),
# not `.github/`, so GitHub does NOT run it. It is parked here on purpose — the
# repo's push token lacks the `workflow` scope, which GitHub requires to create
# or update files under `.github/workflows/`. To activate: rename `.github_` ->
# `.github` and push with a token that has the `workflow` scope.
#
# Scope: this skeleton builds and tests the CNA-independent libraries
# (mc3, mcb, mc3togltf, mc3tomcb) as standalone CMake projects. These have no
# CNA / SDL3 / OpenGL / ImGui dependency and cover 14 of the 18 CTest tests:
#   - mc3        -> mc3_roundtrip
#   - mcb        -> mcb_roundtrip
#   - mc3togltf  -> the 11 mc3togltf_* export tests
#   - mc3tomcb   -> mc3tomcb_roundtrip (+ mcb_roundtrip)
#
# TODO (not yet wired up): a full editor build job. The root project pulls in
# the CNA sibling repo (openeggbert/cna) via `add_subdirectory(../cna ...)` and
# needs SDL3 + OpenGL + SQLite3, so it requires checking out CNA at ../cna and
# installing graphics/system libs. That covers the remaining root-level tests
# (smoke_test, xsd_validation, mc3_registry, mc3_commands).

name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: ${{ matrix.component }} (standalone)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [ mc3, mcb, mc3togltf, mc3tomcb ]
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++-14 python3

      - name: Configure (${{ matrix.component }})
        run: >
          cmake -S ${{ matrix.component }} -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
